data:
  source: synthetic-rehearsal
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 224
  feature_size: 32
  seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  max_samples_per_class: 5000
model:
  epochs: 12
  alpha: 0.0001
  batch_size: 64
artifacts:
  model_path: models/cats_dogs_sgd.joblib
  output_dir: artifacts
tracking:
  uri: file:./mlruns
  experiment: cats-dogs-baseline
