name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/navneet-kang/cats-dogs-api

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov=src --cov-report=term-missing

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: [self-hosted, cats-dogs-deploy]
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy immutable image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_TAG=${{ github.sha }} docker compose pull
          IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8001/health > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Deployment health check timed out."
          exit 1

      - name: Post-deploy smoke test
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/smoke_test.py --url http://localhost:8001 --image tests/fixtures/smoke.ppm
